# Mako notification daemon configuration
# See mako(5) for all available options and defaults.

# --- Active settings ---
icon-location=left
default-timeout=5000
background-color=#1e1e1e
text-color=#ffffff
border-color=#ffd000

[urgency=high]
border-color=#bf616a
default-timeout=0

# --- Global configuration options ---
# Set maximum number of expired notifications to keep in the history buffer.
# If 0, history is disabled.
#max-history=5

# Sort incoming notifications by time and/or priority in ascending(+) or
# descending(-) order.
#sort=-time

# Include another config file at the specified absolute path (or ~/...).
#include=

# --- Binding options ---
#on-button-left=invoke-default-action
#on-button-middle=none
#on-button-right=dismiss
#on-touch=dismiss
#on-notify=none

# --- Style options ---
# Font as a Pango font description.
#font=monospace 10

# Colors may be #RRGGBB or #RRGGBBAA.
#background-color=#285577FF
#text-color=#FFFFFFFF
#border-color=#4C7899FF

# Notification popup dimensions.
#width=300
#height=100

# Margins, padding and border.
# Directional values can be a single value, two (vertical,horizontal),
# three (top,horizontal,bottom) or four (top,right,bottom,left).
#outer-margin=0
#margin=10
#padding=5
#border-size=2
#border-radius=0

# Progress indicator color. Use "over <color>" or "source <color>".
#progress-color=over #5588AAFF

# Icon settings.
#icons=1
#max-icon-size=64
#icon-path=
#icon-location=left
#icon-border-radius=0

# Markup and actions.
#markup=1
#actions=1
#history=1

# Format string. Use \n for a newline.
# Default: <b>%s</b>\n%b
#format=<b>%s</b>\n%b

#text-alignment=left
#default-timeout=0
#ignore-timeout=0
#group-by=none
#max-visible=5
#output=
#layer=top
#anchor=top-right

# --- Criteria examples ---
# [app-name="some-app"]
# background-color=#000000

# [mode=do-not-disturb]
# invisible=1
