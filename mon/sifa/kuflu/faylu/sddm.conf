# SDDM Display Manager Configuration
# https://github.com/sddm/sddm/blob/develop/data/man/sddm.conf.rst.in
#
# Settings set by NixOS (paths, session directories, shutdown/restart commands,
# X/Wayland commands, etc.) will override values here. Only uncomment the
# settings you want to explicitly control from this module.

# =============================================================================
# [General]
# =============================================================================
# DisplayServer=           Select the display server for the greeter.
#                          Valid values: x11, x11-user, wayland
#                          Default: x11
#
# HaltCommand=             Halt command.
#                          Default: systemctl poweroff
#
# RebootCommand=           Reboot command.
#                          Default: systemctl reboot
#
# Numlock=                 Change numlock state when sddm-greeter starts.
#                          Valid values: on, off, none
#                          Default: none
#
# InputMethod=             Set the Qt input method for the greeter.
#                          Examples: qtvirtualkeyboard, ibus, compose
#                          Leave empty if unsure.
#
# Namespaces=              Comma-separated list of Linux namespace paths to
#                          enter with setns() before starting the user session.
#                          Example: /run/netns/mynet
#                          Default: empty

# =============================================================================
# [Theme]
# =============================================================================
[Theme]
Current=breeze

# ThemeDir=                Path of the directory containing theme files.
#                          Default: @DATA_INSTALL_DIR@/themes
#
# Current=                 Name of the current theme. Empty means the embedded
#                          theme will be used.
#                          Default: (empty)
#
# FacesDir=                Path of the directory containing face files
#                          (username.face.icon format).
#                          Default: @DATA_INSTALL_DIR@/faces
#
# CursorTheme=             Name of the cursor theme to set before starting the
#                          display server.
#
# CursorSize=              Cursor size to set before starting the display server.
#
# Font=                    Name of the font to set before starting the display
#                          server. The theme can still override this.
#
# EnableAvatars=           When enabled, home directories are searched for
#                          ".face.icon" images to display as avatars.
#                          Can be slow on some file systems.
#                          Default: true

# =============================================================================
# [X11]
# =============================================================================
# ServerPath=              Path of the X server.
#                          Default: /usr/bin/X
#
# ServerArguments=         Arguments to the X server.
#                          Default: -nolisten tcp
#
# XephyrPath=              Path of the Xephyr nested X server.
#                          Default: /usr/bin/Xephyr
#
# SessionDir=              Comma-separated list of directories containing
#                          session .desktop files.
#                          Default: /usr/local/share/xsessions,/usr/share/xsessions
#
# SessionCommand=          Path of script to execute when starting the user
#                          session. Receives the "Exec" value from the selected
#                          session's .desktop file.
#
# SessionLogFile=          Path to the user session log file, relative to the
#                          home directory.
#                          Default: .local/share/sddm/xorg-session.log
#
# DisplayCommand=          Path of script to execute when starting the display
#                          server. Run as root (x11) or sddm user (x11-user).
#
# DisplayStopCommand=      Path of script to execute when stopping the display
#                          server.
#
# EnableHiDPI=             Enables Qt's automatic HiDPI scaling.
#                          Valid values: true, false
#                          Default: true

# =============================================================================
# [Wayland]
# =============================================================================
# CompositorCommand=       Path of the compositor to execute when starting the
#                          greeter.
#                          Default: weston --shell=kiosk
#
# SessionDir=              Comma-separated list of directories containing
#                          wayland session .desktop files.
#                          Default: /usr/local/share/wayland-sessions,/usr/share/wayland-sessions
#
# SessionCommand=          Path of script to execute when starting the user
#                          session.
#
# SessionLogFile=          Path to the user session log file, relative to the
#                          home directory.
#                          Default: .local/share/sddm/wayland-session.log
#
# EnableHiDPI=             Enables Qt's automatic HiDPI scaling.
#                          Valid values: true, false
#                          Default: true

# =============================================================================
# [Users]
# =============================================================================
# DefaultPath=             Default PATH to set after successfully logging in.
#                          Default: /usr/local/bin:/usr/bin:/bin
#
# MinimumUid=              Minimum user ID of users listed in the greeter.
#                          Default: @UID_MIN@
#
# MaximumUid=              Maximum user ID of users listed in the greeter.
#                          Default: @UID_MAX@
#
# HideUsers=               Comma-separated list of users hidden from the list.
#                          Default: (empty)
#
# HideShells=              Comma-separated list of shells. Users with these
#                          shells are hidden from the list.
#                          Default: (empty)
#
# RememberLastUser=        Update LastUser on every successful login.
#                          Default: true
#
# RememberLastSession=     Update LastSession on every successful login.
#                          Default: true

# =============================================================================
# [Autologin]
# =============================================================================
# User=                    Name of the user to automatically log in on startup.
#                          Default: (empty)
#
# Session=                 Name of the session to automatically log in.
#                          Default: (empty)
#
# Relogin=                 If true and User/Session are set, auto-login will
#                          trigger again on session exit.
#                          Default: false
